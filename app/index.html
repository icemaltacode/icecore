<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>icecore</title>
    <!-- AT THE SITE ROOT, not content-hashed into `assets/`, and the two that must be there
         are why: `/favicon.ico` is what a browser guesses when it has no link to read, and the
         manifest's icon paths are root-absolute with nothing anywhere to rewrite them. The
         rest keep them company rather than living somewhere else for no reason.

         They get there through `copyRootFiles` in bin/icecore.mjs, which puts app/root/ into
         the staging directory Vite serves as publicDir - so `icecore dev` exercises these exact
         paths too. `just deploy` carries them in a third sync pass with a week's cache: unlike
         `assets/*` these URLs are stable, so `immutable` would strand a changed icon. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Last, so a browser that understands the PNGs above prefers them. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- Before the bundle, or the first paint is the wrong theme and the page flips. Kept
         in step with app/src/theme.js, which owns the same key and the same resolution. -->
    <script>
      try {
        var t = localStorage.getItem('ice-theme');
        document.documentElement.dataset.theme =
          t === 'light' || t === 'dark' ? t
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
