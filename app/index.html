<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>icecore</title>
    <!-- THROUGH THE BUNDLE, NOT AT THE BUCKET ROOT, and that is a deployment decision rather
         than a preference. `just deploy` syncs an ALLOWLIST - `assets/*`, `index.html` and
         `auth.json` - because everything else in the bucket belongs to a course pipeline or
         to the stack. Referenced from here, Vite content-hashes these into `assets/`, where
         they are already carried and already cached for a year; put at the root they would
         need a line in that allowlist and a copy step, for a file whose whole job is to be
         named by the two links below.

         The href is root-relative to the VITE root, which is `app/` - the same form the
         module script at the bottom of this file uses. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/src/assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/apple-touch-icon.png" />
    <!-- Last, so a browser that understands the PNGs above prefers them. It is reached only
         through this link: there is no `/favicon.ico` at the bucket root and the distribution
         has no 404 rewrite, so a browser guessing that path gets a 404 rather than the icon.
         Every browser that matters reads the links, and the ones that guess do so only when
         there are none. -->
    <link rel="icon" href="/src/assets/favicon.ico" sizes="any" />
    <!-- Before the bundle, or the first paint is the wrong theme and the page flips. Kept
         in step with app/src/theme.js, which owns the same key and the same resolution. -->
    <script>
      try {
        var t = localStorage.getItem('ice-theme');
        document.documentElement.dataset.theme =
          t === 'light' || t === 'dark' ? t
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
