# Publish a course's content and slides. ONE definition, called by every course repo.
#
# This used to be a template each course copied into its own .github/workflows/. The two
# copies drifted within a fortnight - templates/publish.yml gained a warning that never
# reached the course repo - and a per-deck build would have meant maintaining the deck
# selection logic in two places as well. icecore is public, so a private course repo can
# call this directly; a course's own workflow is now about twelve lines.
#
# THE APP MUST BE DEPLOYED FIRST. This pipeline publishes content and decks and nothing
# else: index.html, the JS bundle and auth.json all come from `just deploy` in the icecore
# repo, which is manual and stays manual. Run that once before this workflow is any use,
# and again whenever the player itself changes. Until then the bucket has no app in it and
# CloudFront answers Access Denied, which says nothing about what is actually missing.
#
# WHAT MAKES THE SELECTIVITY SAFE. Two traps, both of which used to make this actively
# destructive rather than merely wasteful:
#
#   1. The Slides button used to be derived from *built output* in content/slides/<topic>/.
#      Skipping the deck build therefore published a course with no slides links at all,
#      silently. It now comes from the deck source, so the two pipelines are independent.
#   2. `aws s3 sync --delete` against slides/ with a partial dist DELETES EVERY DECK THAT
#      WASN'T REBUILT. So slides sync one prefix at a time, `--delete` never applies to
#      slides/ as a whole, and stale prefixes are reconciled explicitly against the list of
#      decks the course actually has.
#
# Nothing secret is needed: authentication is OIDC, so there is no access key to rotate.

name: publish

on:
  workflow_call:
    inputs:
      aws-role-arn:
        description: The PublisherRoleArn output from `just infra-deploy`.
        required: true
        type: string
      aws-region:
        required: true
        type: string
      site-bucket:
        description: The SiteBucket output.
        required: true
        type: string
      distribution-id:
        description: The DistributionId output.
        required: true
        type: string
      node-version:
        type: string
        default: '22'
      force-all:
        description: Rebuild and republish everything, ignoring what changed.
        type: boolean
        default: false

permissions:
  id-token: write      # required to request the OIDC token
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

env:
  # playwright-chromium is in the slides devDependencies for PDF export only, and its
  # install pulls a browser build nothing in this workflow uses.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, because deciding what to rebuild means diffing against the
          # commit this push started from. A shallow clone makes that commit unreachable and
          # the fallback below rebuilds everything - correct, but slowly, every time.
          fetch-depth: 0

      # ---- what changed -------------------------------------------------------------
      - name: Work out what changed
        id: scope
        run: |
          set -euo pipefail
          before='${{ github.event.before }}'
          all='${{ inputs.force-all }}'

          # A manual run, a new branch, a force-push or a first push all leave us with no
          # usable baseline. Rebuilding everything is the safe answer; saying so is the
          # important part, because "published less than you meant to" is the failure mode
          # of every selective pipeline and it is silent by nature.
          if [ "$all" = 'true' ]; then
            reason='force-all requested'
          elif [ -z "$before" ] || [ "${before//0/}" = '' ]; then
            all=true; reason='no baseline commit for this event'
          elif ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            all=true; reason="baseline ${before:0:8} is not in this clone"
          fi

          if [ "$all" = 'true' ]; then
            echo "rebuilding everything - $reason"
            echo 'content=true' >> "$GITHUB_OUTPUT"
            echo 'slides=true'  >> "$GITHUB_OUTPUT"
            echo 'since='       >> "$GITHUB_OUTPUT"
          else
            changed=$(git diff --name-only "$before" HEAD --)
            echo "$changed" | sed 's/^/  /'
            grep -qE '^content/'          <<<"$changed" && c=true || c=false
            grep -qE '^slides/'           <<<"$changed" && s=true || s=false
            # package-lock.json and the workflow caller itself can change how anything
            # builds, so treat a root-level change as touching both.
            grep -qE '^[^/]+$'            <<<"$changed" && { c=true; s=true; } || true
            echo "content=$c" >> "$GITHUB_OUTPUT"
            echo "slides=$s"  >> "$GITHUB_OUTPUT"
            echo "since=$before" >> "$GITHUB_OUTPUT"
          fi

      # ---- the platform pin ----------------------------------------------------------
      #
      # npm pins a git dependency to a COMMIT, so CI keeps installing whatever
      # package-lock.json names however many times icecore has been pushed since. That is
      # deliberate - the grader is pinned so a bad platform commit cannot silently regrade a
      # whole course - but a pin nobody refreshed is invisible, and what it produces is a
      # green build running old code. The failures then look like broken content.
      #
      # It has bitten twice. Most recently the pin sat on a platform with no Python grading
      # in it while the course had 294 Python exercises, which would have failed as 294
      # content errors.
      #
      # No credentials needed: icecore is the public repo - that is the whole point of
      # keeping course material out of it - so an anonymous compare is enough. The token is
      # only for the rate limit.
      - name: Check the icecore pin is current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pinned=$(jq -r '.packages["node_modules/icecore"].resolved // ""' package-lock.json | sed 's/.*#//')
          if [ -z "$pinned" ]; then
            echo "::warning::no icecore pin in package-lock.json - skipping the staleness check"
            exit 0
          fi
          # base...head, so "ahead by N" means main is N commits in front of the pin.
          api="https://api.github.com/repos/icemaltacode/icecore/compare/$pinned...main"
          body=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                        -H "Accept: application/vnd.github+json" "$api")
          status=$(jq -r '.status // "unknown"' <<<"$body")
          behind=$(jq -r '.ahead_by // 0' <<<"$body")
          case "$status" in
            identical)
              echo "icecore pin ${pinned:0:8} is current" ;;
            ahead)
              echo "::error::The icecore pin is $behind commit(s) behind main."
              echo "::error::This publish would grade the course with an old platform, and"
              echo "::error::anything it got wrong would look like a content problem."
              echo "::error::Fix: npm update icecore --package-lock-only, then commit package-lock.json."
              exit 1 ;;
            behind|diverged)
              # The pin is not an ancestor of main - a branch, or a commit never pushed.
              # Not automatically wrong, but nobody should discover it by accident.
              echo "::warning::The icecore pin ${pinned:0:8} is not on main ($status)."
              echo "::warning::Publishing against it anyway." ;;
            *)
              echo "::warning::Could not compare the icecore pin (GitHub said: $status). Continuing." ;;
          esac

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            slides/package-lock.json

      - run: npm ci

      # Unconditional, even on a content-only push that will not build a single deck.
      # The content build reads the deck sources through @slidev/parser to work out each
      # topic's section ranges, and the parser is resolved from the course's slides/ so it
      # matches the Slidev that builds the decks. Skip this and the parser is missing, every
      # topic loses its interleaving, and index.json ships that way without failing - so a
      # content push would quietly undo what the previous slides push published.
      # The install is cached by setup-node and costs seconds.
      - name: Install the deck toolchain
        run: npm ci --prefix slides

      # ---- gates --------------------------------------------------------------------
      # Every reference solution must grade itself correct and a wrong query must fail.
      # This is the gate: there is no staging environment, so a green verify is the only
      # thing between a broken exercise and the students sitting in front of it.
      #
      # It also validates that every exercise's `section:` resolves to a real slide, which
      # is why it needs the deck sources - but not a built deck, and not Slidev.
      - name: Verify the content
        if: steps.scope.outputs.content == 'true'
        run: npm run verify

      # Only the decks the change actually reached. `icecore slides` resolves each deck's
      # transitive src: includes, so editing pages/_unit-1.5.md rebuilds four decks and
      # editing pages/_frame-close.md rebuilds all of them - and anything non-markdown under
      # slides/ (public/, the theme, the lockfile) is treated as global.
      - name: Build the affected decks
        if: steps.scope.outputs.slides == 'true'
        env:
          SINCE: ${{ steps.scope.outputs.since }}
        run: |
          set -euo pipefail
          # The course's own icecore, not npx: npx would go to the network for a version
          # that has to match the grader the lockfile pins.
          if [ -n "$SINCE" ]; then
            ./node_modules/.bin/icecore slides content --since "$SINCE"
          else
            ./node_modules/.bin/icecore slides content
          fi

      # The content build reads the deck *sources* - for the Slides button and for the
      # section ranges the player interleaves with - so a slides-only push still has to
      # rebuild index.json even though no exercise changed.
      - name: Build content
        run: npm run build

      # ---- publish ------------------------------------------------------------------
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Publish
        env:
          BUCKET: ${{ inputs.site-bucket }}
          DISTRIBUTION: ${{ inputs.distribution-id }}
        run: |
          set -euo pipefail
          paths=()

          # ONE PREFIX PER COURSE, the same way decks are synced one deck at a time, and
          # for the same reason. `aws s3 sync dist/content/ --delete` was right while a site
          # was one course and silently wrong the moment it wasn't: this repo's dist holds
          # only this repo's course, so --delete against the whole content prefix removes
          # every other course on the site. --delete is still right *within* a course - an
          # exercise that has been removed should stop being served.
          for dir in dist/content/*/; do
            course=$(basename "$dir")
            echo "publishing content/$course"
            aws s3 sync "$dir" "s3://$BUCKET/content/$course/" --delete
            paths+=("/content/$course/*")
          done

          # THE CATALOGUE IS ASSEMBLED, NOT PUBLISHED. `courses.json` is the whole site's
          # list and no single course owns it - each build writes a one-entry version, so
          # uploading it here would leave the grid showing only whichever repo published
          # last. Each course publishes its own entry as content/<id>/card.json (just
          # synced, above); the list is then rebuilt from every card.json in the bucket.
          #
          # Self-healing by construction: a course whose prefix is gone drops out without
          # anyone editing anything, and two repos publishing at once converge because both
          # rebuild from the same source of truth rather than from their own dist.
          cards=$(mktemp -d)
          for prefix in $(aws s3 ls "s3://$BUCKET/content/" | awk '/PRE/ {print $2}' | tr -d '/'); do
            aws s3 cp "s3://$BUCKET/content/$prefix/card.json" "$cards/$prefix.json" --quiet \
              || { echo "no card.json under content/$prefix - not a course, skipped"; continue; }
          done
          jq -s '.' "$cards"/*.json > courses.json
          echo "catalogue: $(jq -r 'map(.id) | join(", ")' courses.json)"
          aws s3 cp courses.json "s3://$BUCKET/content/courses.json"
          paths+=('/content/courses.json')

          manifest=content/slides/.built.json
          if [ -f "$manifest" ]; then
            mapfile -t built < <(jq -r '.built[]' "$manifest")
            mapfile -t all   < <(jq -r '.all[]'   "$manifest")

            # One prefix at a time. --delete is scoped to the single deck being replaced, so
            # it can only ever remove files belonging to that deck - never a deck this run
            # did not rebuild.
            for topic in ${built[@]+"${built[@]}"}; do
              [ -d "dist/slides/$topic" ] || continue
              echo "publishing slides/$topic"
              aws s3 sync "dist/slides/$topic/" "s3://$BUCKET/slides/$topic/" --delete
              paths+=("/slides/$topic/*")
            done

            # Reconcile: a deck whose source has been deleted should stop being served, and
            # nothing above would ever remove it. Guarded to things shaped like a topic
            # number so an unrelated prefix under slides/ is never touched.
            live=$(aws s3 ls "s3://$BUCKET/slides/" | awk '/PRE/ {print $2}' | tr -d '/')
            for topic in $live; do
              [[ "$topic" =~ ^[0-9]+(\.[0-9]+)*$ ]] || continue
              printf '%s\n' ${all[@]+"${all[@]}"} | grep -qx "$topic" && continue
              echo "removing slides/$topic - the course no longer has a deck for it"
              aws s3 rm "s3://$BUCKET/slides/$topic/" --recursive
              paths+=("/slides/$topic/*")
            done
          fi

          # A wildcard costs one path instead of sixty, and past a couple of dozen decks the
          # per-path invalidation is both slower and billable.
          if [ "${#paths[@]}" -gt 20 ]; then
            paths=('/content/*' '/slides/*')
          fi
          echo "invalidating: ${paths[*]}"
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION" \
            --paths "${paths[@]}" >/dev/null
